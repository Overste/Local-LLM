# Run through bin/up.sh and bin/opencode.sh, which load config.env and
# local.env and pick the profile for this machine.

name: ${COMPOSE_PROJECT_NAME:-local-llm}

services:
  # Server: the model runtime.
  ollama:
    profiles: [server]
    image: ollama/ollama:${OLLAMA_IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT}:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Keep the agent and autocomplete roles loaded side by side.
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 30m
      # Both reduce the memory a large context needs.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Client: stands in for "ollama" by forwarding to the server over SSH.
  tunnel:
    profiles: [client]
    build: ./tunnel
    restart: unless-stopped
    environment:
      SSH_HOST: ${SSH_HOST}
      REMOTE_PORT: ${OLLAMA_PORT}
    ports:
      - "127.0.0.1:${OLLAMA_PORT}:11434"
    volumes:
      - ${HOME}/.ssh:/host-ssh:ro
    networks:
      default:
        aliases: [ollama]

  # Started on demand by bin/opencode.sh.
  opencode:
    profiles: [opencode]
    build:
      context: ./opencode
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION}
    user: ${CONTAINER_USER}
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      TZ: ${TZ}
    volumes:
      - ${PROJECTS_DIR}:/workspace
      - ${OUT_DIR}/opencode.json:/home/opencode/.config/opencode/opencode.json:ro
      - opencode-data:/home/opencode/.local

volumes:
  ollama-models:
  opencode-data:
